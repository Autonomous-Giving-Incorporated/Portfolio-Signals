name: Cloudflare Workers bootstrap runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_bootstrap_release:
        description: 'Separate operator approval obtained for exact-main read-only bootstrap (not database release)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Cloudflare Workers validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
      - run: npm ci
      - name: Verify static entry points
        run: node scripts/validate-static-routes.mjs
      - name: Test Worker handlers
        working-directory: workers/portfolio-signals
        run: npm test
      - name: Public binding and actual workerd bootstrap acceptance
        run: node --test tests/worker-public-bindings.test.mjs tests/worker-runtime.workerd.test.mjs
      - name: Wrangler config dry-run
        run: npx --no-install wrangler deploy --dry-run --outdir=/tmp/wrangler-dry-run

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approved_bootstrap_release == true
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
      - run: npm ci
      - name: Deploy approved read-only Worker with public binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLATFORM_SUPABASE_URL: ${{ vars.PLATFORM_SUPABASE_URL || vars.STAGING_SUPABASE_URL }}
          PLATFORM_SUPABASE_ANON_KEY: ${{ secrets.PLATFORM_SUPABASE_ANON_KEY || secrets.STAGING_SUPABASE_ANON_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare credential'; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = '315fb44b61212825452aad0ca566ea42' || { echo 'Cloudflare account mismatch'; exit 1; }
          umask 077
          private_dir=$(mktemp -d)
          trap 'rm -rf "$private_dir"' EXIT
          node scripts/prepare-worker-public-bindings.mjs "$private_dir/bindings.json"
          bash scripts/vercel-build.sh
          # Version-atomic binding upload, not a separate secret mutation.
          npx --no-install wrangler deploy --secrets-file "$private_dir/bindings.json"
          # Read back deployment metadata and binding names, never values.
          npx --no-install wrangler deployments list
          npx --no-install wrangler secret list
          echo 'Deployment metadata read back. Operator must complete exact-origin HTTP and suite readback in docs/CF-RUNTIME-CONTINUATION.md; no readiness claim.'
