name: Local security contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    name: Local security contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: services/workbook-parser/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.2.7
      - name: Install parser dependencies
        working-directory: services/workbook-parser
        run: npm ci --ignore-scripts
      - name: Audit parser dependencies
        working-directory: services/workbook-parser
        run: npm audit --audit-level=high
      - name: Validate parser entrypoint
        working-directory: services/workbook-parser
        run: npm run validate
      - name: Test workbook parser quarantine contract
        working-directory: services/workbook-parser
        run: npm test
      - name: Test import API authentication boundary
        working-directory: services/import-api
        run: npm test
      - name: Test role-aware Auth email templates
        run: node --experimental-strip-types --test supabase/functions/_shared/auth-email-templates.test.ts supabase/functions/_shared/auth-assurance.test.ts supabase/functions/_shared/mailosaur-client.test.ts supabase/functions/auth-email/lib.test.ts supabase/functions/auth-email-webhook/lib.test.ts
      - name: Test every.org webhook Worker port
        run: |
          node --test services/allocation-middleware/test/webhook-auth.test.mjs services/allocation-middleware/test/supabase-writer.test.mjs
          npm --prefix workers/portfolio-signals test
      - name: Type-check Edge Functions
        run: |
          set -euo pipefail
          # Root deno.json maps @supabase/supabase-js → npm: with nodeModulesDir auto.
          attempt=1
          max=3
          while true; do
            if deno cache --node-modules-dir=auto \
              supabase/functions/signed-document-url/index.ts \
              supabase/functions/upload-client-asset/index.ts \
              supabase/functions/upload-onboarding-document/index.ts \
              supabase/functions/auth-email/index.ts \
              supabase/functions/auth-email-webhook/index.ts \
              && deno check --node-modules-dir=auto \
              supabase/functions/signed-document-url/index.ts \
              supabase/functions/upload-client-asset/index.ts \
              supabase/functions/upload-onboarding-document/index.ts \
              supabase/functions/auth-email/index.ts \
              supabase/functions/auth-email-webhook/index.ts; then
              break
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "deno cache/check failed after ${max} attempts" >&2
              exit 1
            fi
            echo "Transient failure on attempt ${attempt}/${max}; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done
      - name: Verify private storage controls
        shell: bash
        run: |
          set -euo pipefail
          grep -q "campaign-private" supabase/migrations/006_private_storage.sql
          grep -q "public = false" tests/rls/role_matrix.sql
          grep -q "Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')" supabase/functions/signed-document-url/index.ts
          grep -q "document_records" supabase/migrations/011_document_access_audit.sql
          grep -q "record_document_access" supabase/functions/signed-document-url/index.ts
          grep -q ".eq('id', userData.user.id)" supabase/functions/signed-document-url/index.ts
          grep -q "expiresIn < 30 || expiresIn > 300" supabase/functions/signed-document-url/index.ts
          grep -q "document_access_authorized" supabase/migrations/011_document_access_audit.sql
          grep -q "consent_candidate" import-review.js
          grep -q "approve_import_row" import-review.js
          grep -q "source_name" services/import-api/server.mjs
          grep -q "create_import_batch" services/import-api/server.mjs
          grep -q "require_unexpired_session" supabase/migrations/010_session_expiration.sql
          grep -q "session_expired" supabase/tests/rls_e2e.sql
          grep -q "/auth/v1/user" services/import-api/server.mjs
          grep -q "require_privileged_mfa" services/import-api/server.mjs
          ! grep -q "x-authenticated-user" services/import-api/server.mjs
          ! grep -Eq "logger\.error\([^)]*error" services/import-api/server.mjs
          grep -q "import_batch_creation_failed" services/import-api/server.mjs
          grep -q "import_review_load_failed" import-review.js
          grep -q '"@e965/xlsx": "0.20.3"' services/workbook-parser/package.json
          grep -qx '22.18.0' .nvmrc
          grep -qx 'nodejs 22.18.0' .tool-versions
          grep -qx 'deno 2.2.7' .tool-versions
          grep -qx 'postgres 15.8' .tool-versions
          grep -q 'version: 2.31.8' .github/workflows/local-supabase-tests.yml
          grep -q "campaign-private must not be public" supabase/tests/storage_matrix.sql
          test -f workspace/session.js
          test -f docs/STAGING-BOOTSTRAP.md
          grep -q "remote-staging" scripts/staging/verify-policy-suite.sh
          grep -q "STAGING_CONFIRM_PROJECT_REF" scripts/staging/apply-migrations.sh
          grep -q 'suite_count": 10' scripts/staging/verify-policy-suite.sh
          test -f supabase/tests/016_delegate_auth.sql
          test -f supabase/tests/017_security_definer_privileges.sql
          test -f supabase/tests/018_authenticated_security_definer_privileges.sql
          grep -q "verify_jwt = false" supabase/config.toml
          grep -q "RESEND_API_KEY" supabase/functions/auth-email/index.ts
          test -f scripts/staging/generate-runtime-config.mjs
          grep -q "STAGING_SUPABASE_ANON_KEY" .github/workflows/validate-and-deploy.yml
          grep -q "Refusing to emit runtime config for unlisted Supabase host" scripts/staging/generate-runtime-config.mjs
          grep -q "utdioxwiskzatwoejgiu.supabase.co" scripts/staging/generate-runtime-config.mjs
          grep -q "ALLOW_LEGACY_STAGING_RUNTIME" scripts/staging/generate-runtime-config.mjs
          ! grep -q "SUPABASE_SERVICE_ROLE_KEY" scripts/staging/generate-runtime-config.mjs
          grep -B1 'src="workspace.js"' workspace.html | grep -q 'src="runtime-config.js"'
          grep -B1 'src="import-review.js"' import-review.html | grep -q 'src="runtime-config.js"'
          test -f docs/OPERATIONAL-CONTROLS.md
          test -f docs/RETENTION-LEGAL-HOLD.md
          test -f docs/templates/RESTORE-DRILL-EVIDENCE.md
          grep -q "30-300 seconds; 60-second default" docs/PRODUCTION-HARDENING.md
          grep -q "Production purge automation may be enabled only" docs/RETENTION-LEGAL-HOLD.md
          ! grep -q "private_documents" supabase/functions/signed-document-url/index.ts
          ! grep -q "outreach_authorized" workspace.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          patterns = [
              re.compile(r'BEGIN\s+PRIVATE\s+KEY', re.I),
              re.compile(r'SUPABASE_SERVICE_ROLE_KEY\s*=\s*["\'][^"\']+["\']'),
              re.compile(r'service_role\s*:\s*["\']eyJ[A-Za-z0-9_-]+', re.I),
          ]
          findings = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix == '.md' or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if any(pattern.search(text) for pattern in patterns):
                  findings.append(str(path))
          if findings:
              raise SystemExit('Potential embedded service credential found:\n' + '\n'.join(findings))
          PY
      - name: Verify parser is quarantine-only
        run: |
          grep -q "promotion_authority: false" services/workbook-parser/src/cli.js
          grep -q "only native .xlsx files are accepted" services/workbook-parser/src/cli.js

