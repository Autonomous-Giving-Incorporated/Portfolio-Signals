name: HD-OI-041 Complete Local Acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-supabase-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  local-acceptance:
    name: HD-OI-041 local acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: |
            services/workbook-parser/package-lock.json
            services/import-api/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.2.7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.31.8

      - name: Validate public campaign contract
        run: |
          npx --yes --package ajv-cli@5 --package ajv-formats@3 \
            ajv validate --spec=draft2020 -c ajv-formats \
            -s schemas/public-campaign.schema.json \
            -d data/public-campaign.json

      - name: Parse JavaScript entry points
        run: |
          node --check app.js
          node --check workspace.js
          node --check workspace-nav.js
          node --check import-review.js
          node --check finance-impact.js
          node --check donor-impact.js

      - name: Test role-aware Auth email templates
        run: node --experimental-strip-types --test supabase/functions/_shared/auth-email-templates.test.ts supabase/functions/_shared/auth-assurance.test.ts

      - name: Install and audit workbook parser
        working-directory: services/workbook-parser
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run validate
          npm test

      - name: Test import API
        working-directory: services/import-api
        run: npm test

      - name: Cache and type-check Edge Functions
        run: |
          set -euo pipefail
          # Root deno.json maps @supabase/supabase-js → npm: with nodeModulesDir auto.
          attempt=1
          max=3
          while true; do
            if deno cache --node-modules-dir=auto \
              supabase/functions/signed-document-url/index.ts \
              supabase/functions/upload-client-asset/index.ts \
              supabase/functions/upload-onboarding-document/index.ts \
              supabase/functions/auth-email/index.ts \
              && deno check --node-modules-dir=auto \
              supabase/functions/signed-document-url/index.ts \
              supabase/functions/upload-client-asset/index.ts \
              supabase/functions/upload-onboarding-document/index.ts \
              supabase/functions/auth-email/index.ts; then
              break
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "deno cache/check failed after ${max} attempts" >&2
              exit 1
            fi
            echo "Transient failure on attempt ${attempt}/${max}; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done

      - name: Execute complete security contract
        run: bash scripts/acceptance/run_security_contract.sh

      - name: Start disposable Supabase project
        run: supabase start

      - name: Apply full migration chain
        run: supabase db reset

      - name: Resolve disposable database URL
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          test -n "${DB_URL:-}"
          printf 'DB_URL=%s\n' "$DB_URL" >> "$GITHUB_ENV"

      - name: Load six synthetic roles
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/six_roles.sql

      - name: Execute import gate suite
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/003_import_gate_cases.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/004_import_review_actions.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/005_atomic_import_creation.sql

      - name: Execute role and storage policy suites
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_e2e.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_policy_matrix.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/storage_matrix.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/006_document_access_audit.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/007_agi_tenant_foundation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/008_agi_operational_isolation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/009_agi_workspace_context.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/010_agi_client_configuration.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/011_agi_client_onboarding.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/012_agi_two_person_approvals.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/013_agi_impact_relay_jwt.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/014_agi_two_tenant_acceptance.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/015_client_onboarding_pack.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/016_delegate_auth.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/017_security_definer_privileges.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/018_authenticated_security_definer_privileges.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/019_am_tenant_isolation.sql

      - name: Reject committed sensitive exports
        run: |
          if find . -type f \( -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.csv' -o -iname '*.pdf' \) -not -path './node_modules/*' | grep -q .; then
            echo 'Sensitive or binary source export detected.' >&2
            exit 1
          fi

      - name: Stop and verify disposable stack
        run: |
          set -euo pipefail
          supabase stop --no-backup
          if supabase status >/dev/null 2>&1; then
            echo 'Disposable Supabase stack is still running.' >&2
            exit 1
          fi

      - name: Emit commit-scoped local receipt
        env:
          ACCEPTED_SHA: ${{ github.sha }}
          ACCEPTED_RUN_ID: ${{ github.run_id }}
          ACCEPTED_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p out/audit
          python3 scripts/acceptance/write_local_receipt.py \
            --commit "$ACCEPTED_SHA" \
            --run-id "$ACCEPTED_RUN_ID" \
            --run-url "$ACCEPTED_RUN_URL" \
            --output out/audit/local-acceptance.json
          python3 -m json.tool out/audit/local-acceptance.json >/dev/null
          cat out/audit/local-acceptance.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: hd-oi-041-local-acceptance-${{ github.sha }}
          path: out/audit/local-acceptance.json
          if-no-files-found: error

      - name: Emergency disposable-stack cleanup
        if: failure()
        run: supabase stop --no-backup || true

