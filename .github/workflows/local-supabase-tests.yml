name: Local Supabase Policy Tests

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'services/import-api/**'
      - 'fixtures/autogive-v1/**'
      - 'scripts/synthetic/**'
      - 'tests/autogive-synthetic-v1.test.mjs'
      - '.github/workflows/local-supabase-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'services/import-api/**'
      - 'fixtures/autogive-v1/**'
      - 'scripts/synthetic/**'
      - 'tests/autogive-synthetic-v1.test.mjs'
      - '.github/workflows/local-supabase-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-supabase-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.31.8
      - name: Start disposable Supabase project
        run: supabase start
      - name: Reset and apply migrations
        run: supabase db reset
      - name: Resolve disposable database URL
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          test -n "${DB_URL:-}"
          printf 'DB_URL=%s\n' "$DB_URL" >> "$GITHUB_ENV"
      - name: Load synthetic role fixtures
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/six_roles.sql
      - name: Load AutoGive synthetic dataset v1
        run: SYNTHETIC_SEED_CONFIRM=1 DB_URL="$DB_URL" npm run seed:synthetic
      - name: Execute AutoGive synthetic v1 acceptance
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/024_autogive_synthetic_v1.sql
      - name: Execute synthetic import-gate acceptance checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/003_import_gate_cases.sql
      - name: Execute import-review action checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/004_import_review_actions.sql
      - name: Execute atomic import creation checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/005_atomic_import_creation.sql
      - name: Execute RLS acceptance checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_e2e.sql
      - name: Execute six-role policy matrix
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_policy_matrix.sql
      - name: Execute storage matrix checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/storage_matrix.sql
      - name: Execute signed document access checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/006_document_access_audit.sql
      - name: Execute A.G.I. tenant-isolation checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/007_agi_tenant_foundation.sql
      - name: Execute A.G.I. operational-isolation checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/008_agi_operational_isolation.sql
      - name: Execute A.G.I. workspace-context checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/009_agi_workspace_context.sql
      - name: Execute A.G.I. client-configuration checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/010_agi_client_configuration.sql
      - name: Execute A.G.I. client-onboarding checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/011_agi_client_onboarding.sql
      - name: Execute A.G.I. two-person approval checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/012_agi_two_person_approvals.sql
      - name: Execute A.G.I. Impact Relay JWT checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/013_agi_impact_relay_jwt.sql
      - name: Execute A.G.I. two-tenant acceptance
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/014_agi_two_tenant_acceptance.sql
      - name: Execute client onboarding pack checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/015_client_onboarding_pack.sql
      - name: Execute delegate Auth checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/016_delegate_auth.sql
      - name: Execute SECURITY DEFINER privilege checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/017_security_definer_privileges.sql
      - name: Execute authenticated SECURITY DEFINER architecture checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/018_authenticated_security_definer_privileges.sql
      - name: Execute allocation tenant isolation checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/019_am_tenant_isolation.sql
      - name: Execute ImpactNotice and donation_link checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/020_am_impact_notice.sql
      - name: Execute auth-email per-source dispatch budget checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/021_auth_email_ip_budget.sql
      - name: Execute auth-email delivery-status checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/022_auth_email_delivery_status.sql
      - name: Execute auth-email hard-failure alert checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/023_auth_email_alerts.sql
      - name: Reject committed sensitive exports
        run: |
          if find . -type f \( -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.csv' -o -iname '*.pdf' \) -not -path './node_modules/*' | grep -q .; then
            echo 'Sensitive or binary source export detected.' >&2
            exit 1
          fi
      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup

