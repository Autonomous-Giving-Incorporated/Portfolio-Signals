name: Allocation middleware

on:
  pull_request:
    paths:
      - 'services/allocation-middleware/**'
      - 'workers/portfolio-signals/**'
      - 'fixtures/autogive-v1/**'
      - '.github/workflows/allocation-middleware.yml'
  push:
    branches: [main]
    paths:
      - 'services/allocation-middleware/**'
      - 'workers/portfolio-signals/**'
      - 'fixtures/autogive-v1/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Test
        working-directory: services/allocation-middleware
        run: npm test
      - name: Production config guard (negative)
        working-directory: services/allocation-middleware
        run: |
          set +e
          NODE_ENV=production node -e "import('./src/app/config.mjs').then(m=>{const c=m.loadConfig(process.env); process.exit(c.ok?1:0)})"
          test $? -eq 0
