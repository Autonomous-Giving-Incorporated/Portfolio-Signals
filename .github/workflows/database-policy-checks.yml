name: Database Policy Checks

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/rls/**'
      - '.github/workflows/database-policy-checks.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/rls/**'

permissions:
  contents: read

jobs:
  static-policy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject destructive or embedded secret content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path('supabase'), Path('tests')]
          patterns = {
              'private key': re.compile(r'BEGIN\s+PRIVATE\s+KEY', re.I),
              'literal password': re.compile(r'password\s*=\s*["\'][^"\']+["\']', re.I),
              'literal service key': re.compile(r'SUPABASE_SERVICE_ROLE_KEY\s*=\s*["\'][^"\']+["\']'),
              'literal privileged jwt': re.compile(r'service_role\s*:\s*["\']eyJ[A-Za-z0-9_-]+', re.I),
          }
          findings = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for label, pattern in patterns.items():
                      if pattern.search(text):
                          findings.append(f'{path}: {label}')
          if findings:
              raise SystemExit('Potential embedded secret content found:\n' + '\n'.join(findings))
          PY
          ! grep -RniE 'drop[[:space:]]+(table|schema)[[:space:]]+.*cascade' supabase/migrations || {
            echo 'Destructive CASCADE migration requires separate operator review.'
            exit 1
          }

      - name: Reject duplicate migration versions
        shell: bash
        run: |
          set -euo pipefail
          versions=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | sort)
          duplicates=$(printf '%s\n' "$versions" | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Duplicate migration versions: $duplicates"
            exit 1
          fi

      - name: Verify quarantine controls exist
        shell: bash
        run: |
          set -euo pipefail
          file='supabase/migrations/005_import_quarantine_and_suppression.sql'
          test -f "$file"
          test -f 'supabase/migrations/006_private_storage.sql'
          test -f 'supabase/migrations/007_identity_hardening.sql'
          test -f 'supabase/migrations/008_import_review_actions.sql'
          grep -q 'mfa_enforced' supabase/migrations/007_identity_hardening.sql
          grep -q 'deactivate_profile' supabase/migrations/007_identity_hardening.sql
          grep -q 'approve_import_row' supabase/migrations/008_import_review_actions.sql
          grep -q 'reject_import_row' supabase/migrations/008_import_review_actions.sql
          grep -q 'alter table public.import_batches enable row level security' "$file"
          grep -q 'alter table public.import_staging_rows enable row level security' "$file"
          grep -q 'create table if not exists public.suppression_registry' "$file"
          grep -q 'revoke all on function public.promote_import_row(bigint) from public' "$file"
          grep -q 'consent_blocks_promotion' "$file"
          grep -q 'unresolved_blocking_exception' "$file"

      - name: Verify executable policy test contract
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/rls/import_quarantine.sql
          test -f supabase/tests/003_import_gate_cases.sql
          grep -q 'RLS disabled' tests/rls/import_quarantine.sql
          grep -q 'public must not execute promote_import_row' tests/rls/import_quarantine.sql
          grep -q 'restricted-consent fixture missing' supabase/tests/003_import_gate_cases.sql
          grep -q 'unresolved duplicate fixture missing' supabase/tests/003_import_gate_cases.sql
          grep -q 'suppression fixture missing' supabase/tests/003_import_gate_cases.sql
          grep -q 'restricted consent unexpectedly promoted' supabase/tests/003_import_gate_cases.sql
          grep -q 'unauthorized promotion unexpectedly succeeded' supabase/tests/003_import_gate_cases.sql
          grep -q '00000000-0000-0000-0000-000000000101' supabase/tests/003_import_gate_cases.sql
          grep -q '003_import_gate_cases.sql' .github/workflows/local-supabase-tests.yml
          test -f supabase/tests/004_import_review_actions.sql
          test -f supabase/tests/storage_matrix.sql
          grep -q '004_import_review_actions.sql' .github/workflows/local-supabase-tests.yml
          grep -q 'storage_matrix.sql' .github/workflows/local-supabase-tests.yml
          grep -q 'approve_import_row' import-review.js
          grep -q 'mountDecisionQueue' workspace.js
          grep -q 'mountPipelineWorkspace' workspace.js
          test -f scripts/staging/bootstrap.sh
          test -f scripts/staging/verify-policy-suite.sh

  local-supabase-tests:
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - uses: actions/checkout@v7
      - run: echo 'Executable role enforcement runs in the dedicated local Supabase workflow.'
