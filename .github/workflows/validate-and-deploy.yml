name: Validate and deploy director portal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Portal validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
      - name: Validate campaign data
        run: >-
          npx --yes --package=ajv-cli@5 --package=ajv-formats@3
          ajv validate
          --spec=draft2020
          -c ajv-formats
          -s schemas/public-campaign.schema.json
          -d data/public-campaign.json
          -d fixtures/agi_phase_c/canonical/public_campaign.json
          -d fixtures/agi_phase_c/noncanonical/hacker-dojo-public-campaign.json
          -d fixtures/autogive-v1/public/portfolio-signals-public-campaign.json
      - name: Validate Phase C public-safe fixtures
        run: node --test tests/agi-phase-c-fixtures.test.mjs tests/impact-relay-auth.test.mjs
      - name: Validate AutoGive synthetic corpus
        run: |
          npm run synthetic:validate
          npm run public:fixture:synthetic
          npm run synthetic:test
      - name: Prohibit obvious sensitive-data files
        shell: bash
        run: |
          set -euo pipefail
          prohibited=$(find . -type f \
            \( -iname '*member*registry*' -o -iname '*donor*export*' -o -iname '*contact*list*' -o -iname '*.xlsx' -o -iname '*.csv' \) \
            -not -path './.git/*' -print)
          if [[ -n "$prohibited" ]]; then
            echo "Restricted or review-required data files detected:"
            echo "$prohibited"
            exit 1
          fi
      - name: Verify static entry points
        run: node scripts/validate-static-routes.mjs
      - name: Install browser acceptance dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run two-tenant browser and accessibility acceptance
        run: npm run test:browser

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Skip deploy when Pages is unavailable
        if: steps.pages.outcome != 'success'
        run: |
          echo "GitHub Pages is unavailable for this repository plan or visibility."
          echo "Public portal validation still passed; deploy is skipped rather than failing the branch."
          echo "Enable Pages with GitHub Actions as the source when the plan supports it."
      - name: Generate staging browser runtime config
        if: steps.pages.outcome == 'success'
        env:
          PLATFORM_SUPABASE_URL: ${{ vars.PLATFORM_SUPABASE_URL || vars.STAGING_SUPABASE_URL }}
          PLATFORM_SUPABASE_ANON_KEY: ${{ secrets.PLATFORM_SUPABASE_ANON_KEY || secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: node scripts/staging/generate-runtime-config.mjs
      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

