platform_spec:
  repository: Autonomous-Giving-Incorporated/Autonomous-Giving-Specs
  version: 2.0.0

service:
  id: fund-intel
  role: intelligence
  name: Portfolio Signals

implements:
  specs:
    - SPEC-001
    - SPEC-002
    - SPEC-003
    - SPEC-004
    - SPEC-005
    - SPEC-006
    - SPEC-007
    - SPEC-008
    - SPEC-012
    - SPEC-013
    - SPEC-023
    - SPEC-024
    - SPEC-026
    - SPEC-027
    - SPEC-028
  contracts:
    produces:
      - CONTRACT-013
    consumes: []
  events:
    produces: []
    consumes: []

evidence:
  integration_tests: docs/PLATFORM-CONFORMANCE.md
  notes: >
    Experimental pin to Autonomous Giving Specs v2.0.0 (tag v2.0.0, commit
    c089739). Not a Required/Recommended runtime claim. Intelligence /
    observe-credit boundary: gift summaries and pot credits only; AGI never
    processes donations. every.org is the P0 connector (Worker POST
    /webhooks/every-org). Stripe donation webhooks are rejected (404); Stripe
    is tenant/SaaS billing only. SPEC-023/024/026/027/028 are tracked on this
    Worker. CONTRACT-013 ImpactNotice records are in-repo after proof/waive
    when contact + donation_link exist; not a live send receipt. EVENT-011 is
    not published as a named event. CSV import exists on the Node package;
    Worker POST /import/csv is in-flight (PR 26), not on main. Canonical
    Signal, Opportunity, and Recommendation contracts are not produced.
    Designed host is Cloudflare Workers + platform Supabase.
