platform_spec:
  repository: Autonomous-Giving-Incorporated/Autonomous-Giving-Specs
  version: 2.0.0

service:
  id: fund-intel
  role: intelligence
  name: Portfolio Signals

implements:
  specs:
    - SPEC-001
    - SPEC-002
    - SPEC-003
    - SPEC-004
    - SPEC-005
    - SPEC-006
    - SPEC-007
    - SPEC-008
    - SPEC-012
    - SPEC-013
    - SPEC-023
    - SPEC-024
    - SPEC-026
    - SPEC-027
    - SPEC-028
  contracts:
    produces:
      - CONTRACT-001
      - CONTRACT-002
      - CONTRACT-013
    consumes: []
  events:
    produces: []
    consumes: []

evidence:
  integration_tests: docs/PLATFORM-CONFORMANCE.md
  fund_intel_records: docs/FUND-INTEL-SIGNALS.md
  notes: >
    Experimental pin to Autonomous Giving Specs v2.0.0 (tag v2.0.0, commit
    c089739). Not a Required/Recommended runtime claim and not READY.
    SPEC-003 v2.1.0 (Accepted on Specs main) is the record contract for
    in-process Signal / Opportunity / Recommendation (CODE_SHIPPED; not live).
    EVENT-001/002/003 payloads are retained in-process and are not published
    as named live events. Recommendations MUST NOT mutate pots. Gift write
    and Signal write are separate. Stripe MUST NOT create Signals or gifts
    (/webhooks/stripe returns 404). SPEC-029/030 remain Proposed only — no
    Mission Graph, learning feedback, or metrics. Intelligence / observe-credit
    boundary: gift summaries and pot credits; AGI never processes donations.
    every.org is the P0 connector. CONTRACT-013 ImpactNotice records are
    in-repo after proof/waive when contact + donation_link exist; not a live
    send receipt. EVENT-011 is not published as a named event. Designed host
    is Cloudflare Workers + platform Supabase.
