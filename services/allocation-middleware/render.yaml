# HISTORICAL recipe only. Designed durable host is Cloudflare Workers + Supabase.
# Do not treat a Render URL as durable_named_host. See docs/CLOUDFLARE.md.
#
# Render Blueprint — https://render.com
# Persistent disk mounts at /data for DATA_FILE (Node file store, not production).

services:
  - type: web
    name: agi-allocation
    runtime: docker
    plan: starter
    region: oregon
    rootDir: services/allocation-middleware
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: am-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8787"
      - key: ORG_ID
        value: org_hacker_dojo
      - key: DATA_FILE
        value: /data/state.json
      - key: PROOF_SLA_HOURS
        value: "72"
      # First deploy: "1" to seed; after stable pilot set "0" in dashboard
      - key: SEED_ON_BOOT
        value: "1"
      - key: SEED_ALLOCATE
        value: "1"
      # Prefer director JWT (Phase 3a); emergency token optional
      - key: ALLOW_OPERATOR_TOKEN_FALLBACK
        value: "0"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEBHOOK_TOKEN
        generateValue: true
      - key: OPERATOR_TOKEN
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
