# Example Fly.io config — customize app name and secrets before deploy.
# fly apps create agi-allocation
# fly volumes create am_data --size 1 --region sjc
# fly secrets set ORG_ID=org_pilot OPERATOR_TOKEN=... WEBHOOK_TOKEN=...
# fly deploy

app = "agi-allocation"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  DATA_FILE = "/data/state.json"
  PROOF_SLA_HOURS = "72"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[mounts]
  source = "am_data"
  destination = "/data"
