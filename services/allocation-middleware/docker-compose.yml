# Hacker Dojo allocation pilot — any Docker host (local, VPS, Mac Docker Desktop).
# No Fly CLI required.
#
#   cp .env.example .env.pilot   # edit secrets
#   docker compose --env-file .env.pilot up -d --build
#   BASE_URL=http://127.0.0.1:8787 npm run pilot:smoke
#
# On a VPS with a reverse proxy, set PUBLIC_BASE_URL to your https:// hostname
# and put Caddy/nginx in front of port 8787 (or publish 443 via a proxy container).

services:
  allocation-middleware:
    build: .
    image: agi-allocation-pilot:local
    ports:
      - "${HOST_PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      ORG_ID: ${ORG_ID:-org_hacker_dojo}
      DATA_FILE: /data/state.json
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8787}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:?set WEBHOOK_TOKEN}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      ALLOW_OPERATOR_TOKEN_FALLBACK: ${ALLOW_OPERATOR_TOKEN_FALLBACK:-0}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-1}
      SEED_ALLOCATE: ${SEED_ALLOCATE:-1}
      PROOF_SLA_HOURS: ${PROOF_SLA_HOURS:-72}
    volumes:
      - am_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  am_data:
