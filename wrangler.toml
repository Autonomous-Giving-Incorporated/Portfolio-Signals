# Portfolio Signals — Cloudflare Workers (designed production host).
# Designed stack: Workers (public site + every.org webhook) + platform Supabase
# (utdioxwiskzatwoejgiu). Do not treat Render / Fly / Railway as the durable host.
# Do not add D1 as the canonical store.
#
# Static assets stay on this Worker. Listed API routes run the bootstrap first.
# Bootstrap denies mutations and strips privileged bindings; allocation runtime is unavailable.
# Full allocation/vendor enablement and named-host OBSERVED remain separately gated.
# P1 secrets (never commit): GIVEBUTTER_WEBHOOK_SECRET, DONORBOX_WEBHOOK_SECRET.
# Do not intercept /allocation.html, /allocation-login.html, or /allocation-setup.html.

name = "portfolio-signals"
# Read-only bootstrap until separate reviewed database/runtime release.
main = "workers/portfolio-signals/src/bootstrap.js"
account_id = "315fb44b61212825452aad0ca566ea42"
compatibility_date = "2026-08-13"
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
# /workspace → workspace.html; /workspace/session.js still served from workspace/.
# Not an SPA: unknown paths 404 (not_found_handling default is none).
html_handling = "auto-trailing-slash"
run_worker_first = [
  "/api/ir/provisioning",
  "/api/ir/provisioning/*",
  "/api/ir/workspaces",
  "/api/ir/workspaces/*",
  "/webhooks/*",
  "/healthz",
  "/readyz",
  "/auth/*",
  "/available",
  "/allocations",
  "/proofs",
  "/packet",
  "/exceptions",
  "/labels",
  "/pots/merge",
  "/setup",
  "/seed",
  "/trail",
  "/waivers",
  "/import/csv",
]

[vars]
ORG_ID = "org_hacker_dojo"
PLATFORM_SUPABASE_URL = "https://utdioxwiskzatwoejgiu.supabase.co"

[observability]
enabled = true
head_sampling_rate = 1
